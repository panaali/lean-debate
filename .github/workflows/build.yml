name: build-and-audit
on: [push, pull_request]
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and the pinned toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build (prints the axiom audits)
        run: lake build 2>&1 | tee build.log
      - name: Fail on any axiom or sorry in the development
        run: |
          set -e
          ! grep -rnE "^\s*axiom\b" Debate Debate.lean Main.lean
          ! grep -rnE "\bsorry\b" Debate Debate.lean Main.lean
          if grep -q "depends on axioms" build.log; then echo "a theorem depends on axioms"; exit 1; fi
          echo "axiom-free theorems: $(grep -c 'does not depend on any axioms' build.log)"
      - name: Ledgers render
        run: lake exe report all > /dev/null
